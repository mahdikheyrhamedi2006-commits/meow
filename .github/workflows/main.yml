name: Meow Mafia Timer

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: meow-mafia-runner
  cancel-in-progress: true

permissions: {}

jobs:
  send-meow:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Telethon
        run: pip install --quiet telethon

      - name: Run Meow Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: |
          cat << 'EOF' > bot.py
          import os
          import sys
          import time
          import signal
          import asyncio
          from datetime import datetime, timezone, timedelta
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.errors import FloodWaitError, UnauthorizedError, AuthKeyError

          api_id_raw = os.environ.get("API_ID", "").strip()
          api_hash = os.environ.get("API_HASH", "").strip()
          session = os.environ.get("SESSION_STRING", "").strip()
          group_id_raw = os.environ.get("GROUP_ID", "").strip()

          if not all([api_id_raw, api_hash, session, group_id_raw]):
              raise ValueError("Missing GitHub Secrets (API_ID, API_HASH, SESSION_STRING, GROUP_ID)")

          api_id = int(api_id_raw)
          group_id = int(group_id_raw)

          INTERVAL_SEC = 270          # 4:30 exact
          MAX_RUNTIME_SEC = 330 * 60  # 5h 30m
          IR_TZ = timezone(timedelta(hours=3, minutes=30))

          def now_ir() -> str:
              return datetime.now(IR_TZ).strftime("%H:%M:%S")

          class SessionExpiredError(Exception):
              pass

          async def sleep_or_stop(stop_event: asyncio.Event, seconds: float):
              if seconds <= 0:
                  return
              try:
                  await asyncio.wait_for(stop_event.wait(), timeout=seconds)
              except asyncio.TimeoutError:
                  pass

          async def get_initial_wait(client: TelegramClient, entity) -> float:
              try:
                  msgs = await asyncio.wait_for(
                      client.get_messages(entity, from_user="me", limit=10),
                      timeout=30,
                  )
                  for msg in msgs:
                      if msg and (msg.raw_text or "").strip() == "میو" and msg.date:
                          msg_dt = msg.date if msg.date.tzinfo else msg.date.replace(tzinfo=timezone.utc)
                          elapsed = (datetime.now(timezone.utc) - msg_dt).total_seconds()
                          if 0 <= elapsed < INTERVAL_SEC:
                              return (INTERVAL_SEC - elapsed) + 0.5
                          break
              except Exception as e:
                  print(f"[{now_ir()}] Initial cooldown check skipped: {type(e).__name__} - {e}")
              return 0.0

          async def main():
              stop_event = asyncio.Event()
              loop = asyncio.get_running_loop()
              for sig in (signal.SIGTERM, signal.SIGINT):
                  try:
                      loop.add_signal_handler(sig, stop_event.set)
                  except NotImplementedError:
                      pass

              client = TelegramClient(
                  StringSession(session),
                  api_id,
                  api_hash,
                  connection_retries=5,
                  retry_delay=3,
              )

              start_time = time.monotonic()
              cycle = 0

              try:
                  await asyncio.wait_for(client.connect(), timeout=45)
                  if not await client.is_user_authorized():
                      raise SessionExpiredError("Telegram session is expired or revoked.")

                  try:
                      entity = await client.get_input_entity(group_id)
                  except ValueError:
                      await client.get_dialogs()
                      entity = await client.get_input_entity(group_id)

                  initial_wait = await get_initial_wait(client, entity)
                  if initial_wait > 0:
                      print(f"[{now_ir()}] Last meow was recent; waiting {initial_wait:.1f}s to match 4:30.")
                      await sleep_or_stop(stop_event, initial_wait)

                  while not stop_event.is_set():
                      if time.monotonic() - start_time >= MAX_RUNTIME_SEC:
                          print(f"[{now_ir()}] Reached 5h30m limit; exiting cleanly.")
                          break

                      cycle += 1
                      sent_at = None
                      try:
                          if not client.is_connected():
                              await asyncio.wait_for(client.connect(), timeout=45)
                          await asyncio.wait_for(client.send_message(entity, "میو"), timeout=45)
                          sent_at = time.monotonic()
                          print(f"[{now_ir()}] [Cycle {cycle}] Meow sent!")
                      except (AuthKeyError, UnauthorizedError, SessionExpiredError) as e:
                          print(f"[{now_ir()}] FATAL: {e} -> Generate a new SESSION_STRING.")
                          sys.exit(1)
                      except FloodWaitError as e:
                          wait_sec = e.seconds + 5
                          remaining = MAX_RUNTIME_SEC - (time.monotonic() - start_time)
                          print(f"[{now_ir()}] FloodWait: {e.seconds}s (waiting {wait_sec}s)")
                          if wait_sec >= remaining:
                              break
                          await sleep_or_stop(stop_event, wait_sec)
                          continue
                      except Exception as e:
                          print(f"[{now_ir()}] Error on cycle {cycle}: {type(e).__name__} - {e}")
                          try:
                              if client.is_connected():
                                  await client.disconnect()
                          except Exception:
                              pass
                          remaining = MAX_RUNTIME_SEC - (time.monotonic() - start_time)
                          await sleep_or_stop(stop_event, min(20, remaining))
                          continue

                      remaining = MAX_RUNTIME_SEC - (time.monotonic() - start_time)
                      if remaining <= 10:
                          break
                      wait_time = max(1.0, INTERVAL_SEC - (time.monotonic() - sent_at))
                      await sleep_or_stop(stop_event, min(wait_time, remaining))
              finally:
                  try:
                      if client.is_connected():
                          await client.disconnect()
                  except Exception:
                      pass
                  print(f"[{now_ir()}] Disconnected cleanly.")

          asyncio.run(main())
          EOF
          python -u bot.py
          
